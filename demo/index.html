<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cookie Consent Plugin Demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 40px;
        line-height: 1.5;
      }

      pre {
        background: #f4f4f4;
        padding: 16px;
        border-radius: 8px;
        overflow: auto;
      }

      button {
        margin-right: 8px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Cookie Consent Plugin Demo</h1>
    <p>
      Open this page without a consent cookie to see the banner. Use the buttons
      below to test consent again.
    </p>

    <button type="button" id="clear-consent">Clear consent cookie</button>
    <button type="button" id="open-preferences">Open preferences</button>
    <button type="button" id="show-consent">Show current consent</button>

    <h2>DataLayer</h2>
    <pre id="datalayer-output">[]</pre>

    <script>
      window.dataLayer = window.dataLayer || [];
      window.CookiePluginConfig = {
        consentVersion: 1,
      };

      const originalPush = window.dataLayer.push.bind(window.dataLayer);
      window.dataLayer.push = function (...args) {
        const result = originalPush(...args);
        renderDataLayer();
        return result;
      };

      function renderDataLayer() {
        document.getElementById('datalayer-output').textContent = JSON.stringify(
          window.dataLayer,
          null,
          2
        );
      }

      document.getElementById('clear-consent').addEventListener('click', () => {
        document.cookie = 'cp_cookie_consent=; Max-Age=0; Path=/';
        location.reload();
      });

      document.getElementById('open-preferences').addEventListener('click', () => {
        window.CookiePlugin?.openPreferences();
      });

      document.getElementById('show-consent').addEventListener('click', () => {
        alert(JSON.stringify(window.CookiePlugin?.getConsent(), null, 2));
      });
    </script>
    <script
      src="../dist/cookie-consent.min.js"
      data-privacy-policy-url="/privacy-policy"
      data-cookie-inventory="cookie-inventory.json"
    ></script>
    <script>
      renderDataLayer();
    </script>
  </body>
</html>
